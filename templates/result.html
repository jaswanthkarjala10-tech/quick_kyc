<!DOCTYPE html>
<html>
<head>
  <title>Result - {{ status }}</title>
  <style>body{font-family:sans-serif; background:#f5f5f5; padding:20px} .card{background:white; padding:20px; border-radius:12px; max-width:600px; margin:auto} .LOW{color:green} .MEDIUM{color:orange} .HIGH{color:red; font-weight:bold} .meter{height:20px; background:#eee; border-radius:10px; overflow:hidden; margin:15px 0} .fill{height:100%}</style>
</head>
<body>
  <div class="card">
    <h2>Verification Result</h2>
    <p><b>Customer:</b> {{ name }} | <b>PAN:</b> {{ pan }}</p>
    <h1 class="{{ status }}">{{ status }} RISK - {{ score }}/100</h1>
    <div class="meter"><div class="fill" style="width:{{ score }}%; background:{% if status=='LOW' %}green{% elif status=='MEDIUM' %}orange{% else %}red{% endif %}"></div></div>
    <h3>Why this score?</h3>
    <ul>{% for r in reasons %}<li>{{ r }}</li>{% endfor %}</ul>
    {% if report %}<p><b>SAR Report Generated:</b> {{ report }}</p>{% endif %}
    <h4>OCR Extracted Text:</h4>
    <pre style="background:#f9f9f9; padding:10px; font-size:12px">{{ text }}</pre>
    <a href="/">Check Another</a>
  </div>
</body>
</html>
